[package]
name = "task-runner"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "RUN"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde_json = "1"
ureq = { version = "2", features = ["json"] }
